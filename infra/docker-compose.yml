services:
  mongodb:
    image: mongo:8.0
    container_name: inkloom-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: inkloomai
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - inkloom-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: inkloom-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017/inkloomai
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://inkloom-ai-eight.vercel.app
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  inkloom-mongo-data:
