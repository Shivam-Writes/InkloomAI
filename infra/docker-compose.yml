services:
  mongodb:
    image: mongo:8.0
    container_name: inkloom-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: inkloomai
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - inkloom-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: inkloom-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017/inkloomai
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://inkloom-ai-eight.vercel.app
      RBAC_ADMIN_USERNAME: ${RBAC_ADMIN_USERNAME:-alexander.cross@demo.inkloom.test}
      RBAC_ADMIN_PASSWORD: ${RBAC_ADMIN_PASSWORD:?Copy .env.example to .env and set RBAC_ADMIN_PASSWORD}
      RBAC_BRAND_MANAGER_USERNAME: ${RBAC_BRAND_MANAGER_USERNAME:-elena.rostova@demo.inkloom.test}
      RBAC_BRAND_MANAGER_PASSWORD: ${RBAC_BRAND_MANAGER_PASSWORD:?Set RBAC_BRAND_MANAGER_PASSWORD in .env}
      RBAC_CONTENT_CREATOR_USERNAME: ${RBAC_CONTENT_CREATOR_USERNAME:-marcus.vance@demo.inkloom.test}
      RBAC_CONTENT_CREATOR_PASSWORD: ${RBAC_CONTENT_CREATOR_PASSWORD:?Set RBAC_CONTENT_CREATOR_PASSWORD in .env}
      RBAC_REVIEWER_USERNAME: ${RBAC_REVIEWER_USERNAME:-sarah.jenkins@demo.inkloom.test}
      RBAC_REVIEWER_PASSWORD: ${RBAC_REVIEWER_PASSWORD:?Set RBAC_REVIEWER_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  inkloom-mongo-data:
